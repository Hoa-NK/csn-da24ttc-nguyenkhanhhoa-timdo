<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#c82032">
    <title>Chi tiết bài đăng – ReFind
    </title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/posts.css">
    <link rel="stylesheet" href="../css/post.css">
  </head>
  <body data-page="post">
    <header class="site-header" id="site-header">
      <div class="nav"><a class="brand" href="index.html" aria-label="ReFind, trang chủ"><img src="../assets/logo.png" alt=""><span>ReFind</span></a>
        <form class="search-form" id="search-form" role="search">
          <input type="search" id="search-query" name="q" placeholder="Tìm tên đồ vật hoặc địa điểm…" aria-label="Tìm tên đồ vật hoặc địa điểm">
          <div class="date-search"><button class="date-toggle" type="button" id="date-toggle" aria-label="Tìm theo ngày" title="Tìm theo ngày" aria-expanded="false" aria-controls="date-popover"><svg class="date-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M7.5 3.5v3M16.5 3.5v3M3.5 9.5h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
            <div class="date-popover" id="date-popover" hidden>
              <label for="search-date">Ngày xảy ra
              </label>
              <input type="date" id="search-date">
              <div class="date-popover-actions"><button type="button" id="clear-date">Xóa ngày</button><button type="button" class="apply-date">Tìm kiếm</button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </header>
    <main class="container">
      <div id="post-detail">
      </div>
    </main>
    <footer id="site-footer">
      ReFind
    </footer>
    <script src="../js/storage.js">
    </script>
    <script src="../js/app.js">
    </script>
  </body>
</html>
