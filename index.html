<!doctype html>
<html lang="vi">
  <head>
    <base href="thesis/html/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#27374D">
    <title>ReFind – Tìm kiếm đồ thất lạc
    </title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/posts.css">
    <link rel="stylesheet" href="../css/index.css">
  </head>
  <body data-page="home">
    <header class="site-header" id="site-header">
      <div class="nav"><a class="brand" href="index.html" aria-label="ReFind, trang chủ"><img src="../assets/logo.png" alt=""><span>ReFind</span></a>
        <form class="search-form" id="search-form" role="search">
          <input type="search" id="search-query" name="q" placeholder="Tìm tên đồ vật hoặc địa điểm…" aria-label="Tìm tên đồ vật hoặc địa điểm">
          <div class="date-search"><button class="date-toggle" type="button" id="date-toggle" aria-label="Tìm theo ngày" title="Tìm theo ngày" aria-expanded="false" aria-controls="date-popover"><svg class="date-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M7.5 3.5v3M16.5 3.5v3M3.5 9.5h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
            <div class="date-popover" id="date-popover" hidden>
              <label for="search-date">Ngày xảy ra
              </label>
              <div class="date-input-row"><input type="text" id="search-date" inputmode="numeric" placeholder="dd/mm/yyyy" maxlength="10" pattern="(?:0[1-9]|[12][0-9]|3[01])/(?:0[1-9]|1[0-2])/[0-9]{4}" title="Nhập ngày theo định dạng dd/mm/yyyy"><span class="date-picker-control"><button type="button" aria-label="Chọn ngày"><svg class="date-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M7.5 3.5v3M16.5 3.5v3M3.5 9.5h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><input type="date" id="search-date-native" class="date-native-picker" aria-label="Chọn ngày"></span></div>
              <div class="date-popover-actions"><button type="button" id="clear-date">Xóa ngày</button><button type="button" class="apply-date" id="apply-date">Tìm kiếm</button>
              </div>
            </div>
          </div>
        </form>
        <nav class="nav-actions" id="nav-actions" aria-label="Tài khoản"><a class="header-link" href="login.html">Đăng nhập</a><a class="header-link" href="register.html">Đăng ký</a></nav>
      </div>
    </header>
    <main class="container">
      <section class="home-hero" aria-label="ReFind Đại học Trà Vinh">
        <div class="home-categories" aria-label="Danh mục bài đăng">
          <a class="category-card category-all" href="posts.html"><strong>Tất cả bài đăng</strong></a>
          <a class="category-card" id="report-lost" href="login.html?next=post-form.html%3Ftype%3Dlost"><strong>Báo mất đồ</strong></a>
          <a class="category-card" id="report-found" href="login.html?next=post-form.html%3Ftype%3Dfound"><strong>Báo nhặt được đồ</strong></a>
        </div>
        <div class="poster panel"><img src="../assets/poster-refind.jpg" alt="ReFind: Mất đồ? Nhặt được đồ? Đăng tin để đồ thất lạc trong trường sớm về đúng chủ."></div>
      </section>
      <section class="listing-section latest-section" aria-label="Bài đăng mới nhất">
        <div class="section-heading page-title-bar"><h2 id="listing-title">Bài đăng mới nhất</h2><a class="button section-all-link" href="posts.html">Xem tất cả bài đăng</a></div>
        <div class="post-grid" id="post-grid" aria-live="polite">
        </div>
      </section>
    </main>
    <footer id="site-footer">
    </footer>
    <script src="../js/storage.js">
    </script>
    <script src="../js/app.js">
    </script>
  </body>
</html>
