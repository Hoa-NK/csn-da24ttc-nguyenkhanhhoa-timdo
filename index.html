<!doctype html>
<html lang="vi">
  <head>
    <base href="thesis/html/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#c82032">
    <title>ReFind – Tìm kiếm đồ thất lạc
    </title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/posts.css">
    <link rel="stylesheet" href="../css/index.css">
  </head>
  <body data-page="home">
    <header class="site-header" id="site-header">
      <div class="nav"><a class="brand" href="index.html" aria-label="ReFind, trang chủ"><img src="../assets/logo.png" alt=""><span>ReFind</span></a>
        <form class="search-form" id="search-form" role="search">
          <input type="search" id="search-query" name="q" placeholder="Tìm tên đồ vật hoặc địa điểm…" aria-label="Tìm tên đồ vật hoặc địa điểm">
          <div class="date-search"><button class="date-toggle" type="button" id="date-toggle" aria-label="Tìm theo ngày" title="Tìm theo ngày" aria-expanded="false" aria-controls="date-popover"><svg class="date-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M7.5 3.5v3M16.5 3.5v3M3.5 9.5h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
            <div class="date-popover" id="date-popover" hidden>
              <label for="search-date">Ngày xảy ra
              </label>
              <input type="date" id="search-date">
              <div class="date-popover-actions"><button type="button" id="clear-date">Xóa ngày</button><button type="button" class="apply-date" id="apply-date">Tìm kiếm</button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </header>
    <main class="container">
      <section class="home-top" aria-label="Tìm kiếm và lọc bài đăng">
        <aside class="filters panel">
          <div class="filter-actions"><a class="button" id="report-lost" href="post-form.html?type=lost">Báo mất đồ</a><a class="button button-outline" id="report-found" href="post-form.html?type=found">Báo nhặt được đồ</a>
          </div>
        </aside>
        <section class="poster panel" aria-label="Giới thiệu ReFind">
          <div class="poster-image"><img src="../assets/poster.png" alt="Poster ReFind" class="poster-photo">
          </div>
        </section>
      </section>
      <section class="listing-section" aria-label="Danh sách bài đăng">
        <div class="listing-filter-bar" id="listing-title">
          Tất cả
        </div>
        <div class="filter-chips page-chips" role="group" aria-label="Lọc sản phẩm"><button class="chip is-active" type="button" data-filter="all">Tất cả</button><button class="chip" type="button" data-filter="found">Đồ nhặt được</button><button class="chip" type="button" data-filter="lost">Đồ thất lạc</button><button class="chip" type="button" data-filter="recent">Mới nhất</button>
        </div>
        <div class="post-grid" id="post-grid" aria-live="polite">
        </div>
      </section>
    </main>
    <footer id="site-footer">
    </footer>
    <script src="../js/storage.js">
    </script>
    <script src="../js/app.js">
    </script>
  </body>
</html>
